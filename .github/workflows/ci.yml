name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Data-quality checks + query tests + fixture tests
        run: pytest -v
      - name: Run every query end to end
        run: python -m ehr_sql.run
