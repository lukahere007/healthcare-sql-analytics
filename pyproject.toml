[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-sql"
version = "0.1.0"
description = "SQL analytics on synthetic electronic health records (Synthea + DuckDB)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luke Wamalwa" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
